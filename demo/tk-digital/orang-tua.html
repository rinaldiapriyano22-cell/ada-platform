<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TK Digital — Aplikasi Orang Tua</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaf5ff;color:#17385e;font-family:Arial,sans-serif}
.phone{max-width:430px;min-height:100vh;margin:auto;background:#f7fbff;box-shadow:0 0 30px #234b7020;padding-bottom:112px;position:relative}
header{background:linear-gradient(135deg,#087bdc,#39b8f2);color:white;padding:21px 20px 25px;border-radius:0 0 24px 24px}
.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:15px;font-weight:800;letter-spacing:.5px}.circle{border:1px solid #ffffff55;background:#ffffff24;color:white;border-radius:13px;min-width:40px;height:40px;padding:0 9px;font-size:14px;font-weight:bold}
.welcome{font-size:23px;font-weight:700;margin:20px 0 6px}.sub{font-size:13px;opacity:.92}
main{padding:15px 18px}.section{font-size:16px;font-weight:700;margin:16px 0 11px;letter-spacing:.1px}
.card{background:white;border:1px solid #eaf0f6;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #174a7b08}
.small{font-size:12px;color:#71839b;line-height:1.5}.muted{color:#71839b}.kid{display:flex;gap:12px;align-items:center}.kidpic{width:54px;height:54px;background:#e8f4ff;border:1px solid #d8ebfa;border-radius:16px;display:grid;place-items:center;font-size:12px;font-weight:bold;color:#087bdc;flex-shrink:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border-radius:14px;padding:14px;background:#e4f3ff;font-size:12px;min-height:78px;line-height:1.45}.tile b{display:block;font-size:16px;margin-bottom:7px;color:#087bdc}.green{background:#dcf8e4}.yellow{background:#fff0c9}.purple{background:#eee5ff}.pink{background:#ffe7ef}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid #edf2f7;font-size:13px}.row:last-child{border:0}
.tag{font-size:10px;background:#dff8e7;color:#17834a;padding:5px 9px;border-radius:20px;white-space:nowrap}.tag.blue{background:#e2f2ff;color:#087bdc}.tag.gold{background:#fff0c9;color:#946200}
button{font-family:inherit;cursor:pointer}.primary{background:#087bdc;color:white;border:0;padding:12px 15px;border-radius:13px;font-weight:bold;width:100%;margin-top:10px}.secondary{background:#e4f3ff;color:#087bdc;border:0;padding:10px 13px;border-radius:12px;font-weight:bold}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:white;border-top:1px solid #e7eef6;display:flex;justify-content:space-around;padding:9px 2px calc(9px + env(safe-area-inset-bottom));z-index:5}
nav button{border:0;background:none;color:#71839b;font-size:12px;min-width:58px;padding:10px 7px;border-radius:12px}nav button.active{color:#087bdc;background:#e8f4ff;font-weight:bold}
.hidden{display:none}.bar{height:8px;background:#edf2f7;border-radius:20px;overflow:hidden;margin:7px 0 3px}.bar span{display:block;height:100%;background:#39b8f2;border-radius:20px}
.notice{background:#fff7df;border:1px solid #ffe7a8;border-radius:15px;padding:12px;font-size:12px;line-height:1.5;color:#765600}
.select{border:1px solid #d9e8f5;background:#fff;border-radius:11px;padding:9px;color:#17385e;font-size:12px}
.avatar{width:42px;height:42px;border-radius:14px;background:#e4f3ff;display:grid;place-items:center;font-size:23px}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:8px}


.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:10px 0 17px}
.menu-card{min-height:112px;text-align:left;background:#fff;border:1px solid #e6eef6;border-radius:16px;padding:14px 13px;box-shadow:0 3px 12px #174a7b08;color:#17385e;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.menu-card:active{transform:scale(.98);background:#f4faff}
.menu-icon{width:34px;height:34px;border-radius:11px;background:#e7f3ff;color:#087bdc;display:grid;place-items:center;font-size:17px;font-weight:700}
.menu-card b{font-size:12px;line-height:1.3}
.menu-card small{font-size:10px;line-height:1.35;color:#71839b}


.menu-icon{width:42px;height:42px;border-radius:14px;font-size:21px;box-shadow:inset 0 1px 0 #ffffffaa}
.icon-child{background:#e4f1ff;color:#3688d8}
.icon-attend{background:#e1f8eb;color:#21965b}
.icon-report{background:#eee8ff;color:#8058d6}
.icon-activity{background:#fff0d8;color:#d48b24}
.icon-food{background:#e0f7ed;color:#299b71}
.icon-pay{background:#ffe8e5;color:#dc705c;font-size:15px}
.icon-calendar{background:#e3f2ff;color:#3189cb}
.icon-message{background:#ffe8f0;color:#d65f8c}
.icon-setting{background:#edf0f5;color:#68798e}
.icon-notice{background:#fff3d8;color:#c18a20}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid #e6edf5;display:flex;justify-content:space-around;padding:8px 4px 22px;z-index:5;box-shadow:0 -5px 18px #234b7010}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:transparent;color:#71839b;font-size:10px;min-width:58px;padding:7px 10px;border-radius:14px}
nav button.active{color:#087bdc;background:#e8f4ff;font-weight:700}



/* Dashboard Orang Tua: mengikuti referensi aplikasi mobile */
body{background:#edf5ff;color:#101f55}
.phone{max-width:430px;background:#f9fbff;padding-bottom:100px}
header{position:relative;overflow:hidden;padding:23px 22px 34px;border-radius:0 0 30px 30px;background:linear-gradient(135deg,#0876d8 0%,#079eea 58%,#39bdf5 100%)}
header:after{content:"🏫";position:absolute;right:18px;bottom:3px;font-size:104px;opacity:.95;filter:drop-shadow(0 8px 5px #064b8a55)}
.brand{font-size:18px;letter-spacing:.4px}
.welcome{font-size:23px;margin:25px 0 6px;position:relative;z-index:1}
.sub{font-size:14px;line-height:1.45;max-width:250px;position:relative;z-index:1}
main{padding:0 18px 18px;position:relative}
.headrow{margin:13px 0 0}
#pageTitle{display:none}
#childSelect{position:absolute;top:-29px;right:27px;z-index:2;max-width:112px;background:#ffffffdd}
.child-summary{position:relative;margin-top:-3px;background:white;border-radius:24px;padding:18px 15px 14px;box-shadow:0 8px 22px #174a7b20;border:1px solid #e7f1fc}
.child-top{display:flex;align-items:center;gap:12px;padding:0 2px 16px}
.kidpic.graduation{width:65px;height:65px;font-size:34px;background:#e3f3ff;border-radius:20px}
.child-name{min-width:0;flex:1;color:#101f55}
.child-name b{font-size:20px;display:block;margin-bottom:4px}
.child-name .small{font-size:12px}
.change-child{border:0;border-radius:25px;background:#e3f2ff;color:#0757c8;font-weight:700;padding:10px 12px;font-size:12px;white-space:nowrap}
.status-strip{display:grid;grid-template-columns:repeat(3,1fr);background:#e6f5ff;border:1px solid #c6e7ff;border-radius:18px;padding:10px 5px}
.status-strip>div{display:flex;align-items:center;justify-content:center;gap:6px;padding:2px 5px;font-size:10px;border-right:1px solid #7bb9ef}
.status-strip>div:last-child{border:0}
.status-strip strong{display:block;font-size:12px;color:#0872d8;margin-top:4px;white-space:nowrap}
.status-strip .good{color:#16853b}
.status-icon{font-size:22px}
.section{font-size:17px;margin:18px 2px 10px}
.home-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:17px 0 20px}
.home-grid .menu-card{height:108px;min-height:108px;align-items:center;justify-content:center;text-align:center;padding:9px 5px;gap:6px;border:0;border-radius:22px;box-shadow:none}
.home-grid .menu-icon{width:auto;height:auto;background:transparent;box-shadow:none;font-size:35px;border-radius:0}
.home-grid .menu-card b{font-size:12px;line-height:1.2}
.blue-card{background:#d8efff}.yellow-card{background:#fff0c7}.purple-card{background:#eee0ff}
.green-card{background:#d9f8e8}.pink-card{background:#ffe3ee}
.latest-heading{display:flex;align-items:center;justify-content:space-between}
.latest-heading button{border:0;background:none;color:#0874dc;font-size:13px;font-weight:600}
.notification-card{display:flex;align-items:center;gap:10px;background:white;border:1px solid #d8e9fb;border-radius:18px;padding:12px;box-shadow:0 3px 12px #174a7b0b;position:relative}
.notice-icon{width:48px;height:48px;border-radius:15px;background:#e4f3ff;display:grid;place-items:center;font-size:26px;flex-shrink:0}
.notification-card div{flex:1;min-width:0}
.notification-card b{font-size:13px;color:#101f55}
.notification-card p{font-size:11px;line-height:1.35;margin:4px 0 0;color:#43536c}
.notification-card small{font-size:9px;color:#71839b;align-self:flex-start;white-space:nowrap}
.chevron{font-size:25px;color:#71839b}
nav{min-height:78px;padding:8px 4px 21px;background:#ffffffed;border-radius:22px 22px 0 0;box-shadow:0 -4px 20px #234b7012}
nav button{min-width:65px;font-size:11px;padding:7px 8px}
.navicon{font-size:23px}
.phone:after{bottom:7px;width:100px;height:4px;background:#18243b77}
@media(max-width:360px){.child-name b{font-size:17px}.change-child{font-size:10px;padding:9px}.status-strip>div{gap:3px}.status-strip strong{font-size:10px}.home-grid .menu-card{height:98px;min-height:98px}}


nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:68px;background:rgba(255,255,255,.97);border-top:1px solid #e5edf7;display:flex;align-items:center;justify-content:space-around;padding:7px 12px calc(7px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 -5px 18px #234b7010;border-radius:20px 20px 0 0}
nav button{width:54px;height:50px;display:grid;place-items:center;border:0;background:transparent;color:#17264b;border-radius:16px;padding:0;cursor:pointer;transition:background .15s ease,color .15s ease}
nav button.active{background:#dcefff;color:#087bdc}
.navicon{display:grid;place-items:center;width:28px;height:28px;margin:0}
.navicon svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button:first-child .navicon svg{fill:currentColor;stroke:currentColor}
.phone:after{content:"";position:fixed;bottom:5px;left:50%;transform:translateX(-50%);width:104px;height:4px;background:#25334a77;border-radius:8px;z-index:11;pointer-events:none}

</style>
</head>
<body><div class="phone">
<header>
 <div class="top"><div class="brand">TK DIGITAL</div><button class="circle" onclick="showPage(8)" aria-label="Notifikasi">Notifikasi</button></div>
 <div class="welcome" id="welcome">Selamat datang, Ibu Sari</div>
 <div class="sub" id="subtitle">Pantau aktivitas dan perkembangan buah hati di sekolah</div>
</header>
<main><div class="headrow"><div class="section" id="pageTitle">Beranda</div><select class="select" id="childSelect" onchange="changeChild(this.value)"><option value="aisyah">Aisyah</option><option value="rafi">Rafi</option></select></div>
<div id="content"></div></main>
<nav id="nav"></nav>
</div>
<script>
const children={
 aisyah:{name:'Aisyah Putri',class:'Kelompok B',teacher:'Ibu Maya',emoji:'Anak',attendance:'Hadir'},
 rafi:{name:'Rafi Pratama',class:'Kelompok A',teacher:'Ibu Nisa',emoji:'Anak',attendance:'Hadir'}
};
let child='aisyah',page=0;
const tabs=[
 ['Beranda','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.8 12 3l9 7.8v9a1.2 1.2 0 0 1-1.2 1.2h-5.2v-6.2H9.4V21H4.2A1.2 1.2 0 0 1 3 19.8z"/></svg>'],
 ['Anak','<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M2.8 20v-1.2a6.2 6.2 0 0 1 12.4 0V20z"/><path d="M16 5.2a3.2 3.2 0 0 1 0 6.2M18 14.4a5.3 5.3 0 0 1 3.2 4.8V20"/></svg>'],
 ['Absensi','<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="17" rx="2.4"/><path d="M7.5 2.5v4M16.5 2.5v4M3 9h18M8 14l2.4 2.4 5-5"/></svg>'],
 ['Laporan','<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11h4v9zM10 20V5h4v15zM16 20V8h4v12z"/></svg>'],
 ['Lainnya','<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>']
];
function home(){let c=children[child];return `
<div class="child-summary">
 <div class="child-top">
  <div class="kidpic graduation">🎓</div>
  <div class="child-name"><b>${c.name}</b><div class="small">● ${c.class} · TK Contoh Ceria</div></div>
  <button class="change-child" onclick="document.getElementById('childSelect').focus()">Ganti Anak⌄</button>
 </div>
 <div class="status-strip">
  <div><span class="status-icon">🗓️</span><span>Kehadiran<strong>22/23 Hari</strong></span></div>
  <div><span class="status-icon">⭐</span><span>Perkembangan<strong class="good">Sangat Baik</strong></span></div>
  <div><span class="status-icon">🍴</span><span>Gizi<strong>Normal</strong></span></div>
 </div>
</div>
<div class="menu-grid home-grid">
 <button class="menu-card blue-card" onclick="showPage(1)"><span class="menu-icon">🏠</span><b>Profil Anak</b></button>
 <button class="menu-card yellow-card" onclick="showPage(2)"><span class="menu-icon">🗓️</span><b>Absensi</b></button>
 <button class="menu-card purple-card" onclick="showPage(3)"><span class="menu-icon">📊</span><b>Perkembangan</b></button>
 <button class="menu-card green-card" onclick="showPage(4)"><span class="menu-icon">📖</span><b>Kegiatan Belajar</b></button>
 <button class="menu-card pink-card" onclick="showPage(5)"><span class="menu-icon">🥗</span><b>Gizi Anak</b></button>
 <button class="menu-card blue-card" onclick="showPage(6)"><span class="menu-icon">👛</span><b>Pembayaran</b></button>
 <button class="menu-card purple-card" onclick="showPage(7)"><span class="menu-icon">📅</span><b>Kalender Sekolah</b></button>
 <button class="menu-card green-card" onclick="showMore()"><span class="menu-icon">📢</span><b>Pengumuman</b></button>
 <button class="menu-card pink-card" onclick="showPage(8)"><span class="menu-icon">💬</span><b>Pesan dari Sekolah</b></button>
</div>
<div class="section latest-heading"><b>Pemberitahuan Terbaru</b><button onclick="showPage(10)">Lihat Semua ›</button></div>
<div class="notification-card" onclick="showPage(10)"><span class="notice-icon">📣</span><div><b>Kegiatan Outing Class</b><p>Outing Class ${c.class} akan dilaksanakan pada Jumat, 21 November 2026.</p></div><small>2 jam lalu</small><span class="chevron">›</span></div>
`; }
function childPage(){let c=children[child];return `<div class="card"><div class="kid"><div class="kidpic">${c.emoji}</div><div><b>${c.name}</b><div class="small">Data siswa · ${c.class}</div></div></div><div class="row">Nama lengkap<strong>${c.name}</strong></div><div class="row">Kelas<strong>${c.class}</strong></div><div class="row">Wali kelas<strong>${c.teacher}</strong></div><div class="row">Sekolah<strong>TK Contoh Ceria</strong></div><div class="row">Status siswa<span class="tag">Aktif</span></div></div><div class="card"><b>Orang tua / wali terhubung</b><div class="row">Ibu Sari <span class="tag">Ibu</span></div><div class="row">Bapak Andi <span class="tag">Ayah</span></div><p class="small">Contoh fitur: satu akun keluarga dapat terhubung dengan lebih dari satu anak dan wali yang diizinkan sekolah.</p></div>`}
function attendance(){return `<div class="card"><div class="headrow"><b>Rekap kehadiran</b><span class="tag">November 2026</span></div><div class="grid"><div class="tile green"><b>18</b>Hadir</div><div class="tile yellow"><b>1</b>Izin</div><div class="tile pink"><b>0</b>Sakit</div><div class="tile purple"><b>1</b>Tanpa keterangan</div></div></div><div class="card"><b>Riwayat kehadiran</b><div class="row">Senin, 16 Nov <span class="tag">Hadir</span></div><div class="row">Jumat, 13 Nov <span class="tag">Hadir</span></div><div class="row">Kamis, 12 Nov <span class="tag gold">Izin</span></div><div class="row">Rabu, 11 Nov <span class="tag">Hadir</span></div><p class="small">Data di atas hanya contoh tampilan.</p></div>`}
function reports(){return `<div class="card"><b>Laporan perkembangan anak</b><p class="small">Ringkasan pengamatan guru pada periode November 2026.</p>${[['Bahasa','Mulai berkembang',65],['Kognitif','Berkembang sesuai tahap',75],['Motorik','Berkembang sesuai tahap',80],['Sosial-emosional','Berkembang baik',78],['Seni dan kreativitas','Berkembang baik',82],['Nilai agama dan budi pekerti','Berkembang baik',75]].map(x=>`<div style="margin:14px 0"><div class="headrow"><b style="font-size:13px">${x[0]}</b><span class="small">${x[1]}</span></div><div class="bar"><span style="width:${x[2]}%"></span></div></div>`).join('')}</div><div class="card"><b>Catatan dari guru</b><p class="small">Aisyah mulai berani menceritakan pengalaman sederhana di depan teman-temannya. Terus berikan kesempatan bercerita dan membaca buku bersama di rumah.</p><span class="tag blue">16 November 2026 · Ibu Maya</span></div><button class="primary" onclick="alert('Demo: laporan PDF dapat diunduh setelah sistem terhubung.')">Lihat / Unduh laporan lengkap</button>`}
function activities(){return `<div class="card"><b>Aktivitas hari ini</b><div class="row"><span> Membaca cerita bergambar</span><span class="tag">Selesai</span></div><div class="row"><span> Mewarnai bentuk geometri</span><span class="tag">Selesai</span></div><div class="row"><span> Gerak dan lagu</span><span class="tag gold">Terjadwal</span></div></div><div class="card"><b>Dokumentasi kegiatan</b><div class="grid"><div class="tile yellow"><b></b>Foto belajar</div><div class="tile purple"><b></b>Hasil karya</div></div><p class="small">Foto dan hasil karya akan ditampilkan oleh sekolah jika sudah diunggah guru.</p></div><div class="card"><b>Tugas / aktivitas di rumah</b><p class="small">Ajak anak menyebutkan 3 benda berbentuk lingkaran di rumah.</p><span class="tag blue">Opsional · Bersama keluarga</span></div>`}
function nutrition(){return `<div class="card"><b>Menu makan hari ini</b><div class="row"> Nasi dan lauk sederhana <span class="tag">Menu</span></div><div class="row"> Sayur bening <span class="tag">Menu</span></div><div class="row"> Buah pisang <span class="tag">Menu</span></div><div class="row"> Air putih <span class="tag">Minum</span></div></div><div class="card"><b>Catatan dari sekolah</b><p class="small">Aisyah mengikuti kegiatan makan bersama. Guru dapat menambahkan catatan tentang kebiasaan makan atau informasi yang perlu diketahui orang tua.</p></div><div class="notice">Informasi menu bukan diagnosis kesehatan. Pemantauan pertumbuhan atau kondisi gizi perlu dilakukan dengan pengukuran dan standar yang sesuai oleh tenaga yang kompeten.</div>`}
function payments(){return `<div class="card"><div class="headrow"><b>Tagihan sekolah</b><span class="tag gold">Contoh</span></div><div class="row">SPP November 2026<strong>Rp150.000</strong></div><div class="row">Kegiatan sekolah<strong>Rp25.000</strong></div><div class="row">Total tagihan<strong>Rp175.000</strong></div><span class="tag gold">Menunggu pembayaran</span><button class="primary" onclick="alert('Demo saja: pembayaran online belum diaktifkan.')">Lihat instruksi pembayaran</button></div><div class="card"><b>Riwayat pembayaran</b><div class="row">SPP Oktober 2026 <span class="tag">Lunas</span></div><div class="row">SPP September 2026 <span class="tag">Lunas</span></div><p class="small">Pembayaran pada demo tidak memproses uang sungguhan.</p></div>`}
function calendar(){return `<div class="card"><b>Agenda November 2026</b><div class="row"><span><b>18 Nov</b><br><span class="small">Kegiatan tema lingkungan</span></span><span class="tag blue">Sekolah</span></div><div class="row"><span><b>21 Nov</b><br><span class="small">Pertemuan orang tua</span></span><span class="tag gold">Penting</span></div><div class="row"><span><b>25 Nov</b><br><span class="small">Hari Guru</span></span><span class="tag blue">Sekolah</span></div></div><div class="card"><b>Pengingat</b><p class="small">Jadwal dapat berubah sesuai pengumuman resmi sekolah.</p></div>`}
function messages(){return `<div class="card"><b>Pesan dari sekolah</b><div class="row"><div><b>Orang Tua‍ Ibu Maya</b><div class="small">Terima kasih sudah mendampingi kegiatan belajar di rumah.</div></div><span class="tag blue">Baru</span></div><div class="row"><div><b> Admin Sekolah</b><div class="small">Informasi pertemuan orang tua tanggal 21 November.</div></div><span class="tag">Dibaca</span></div><button class="primary" onclick="alert('Demo: fitur balas pesan belum terhubung.')">Tulis pesan ke sekolah</button></div>`}
